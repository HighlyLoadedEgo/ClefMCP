name: Publish to npm

# Publishes on version tags (v0.1.0, ...) via npm Trusted Publishing (OIDC):
# no NPM_TOKEN secret required. Configure the trusted publisher on npmjs.com
# once (package → Settings → Trusted Publisher):
#   repository: HighlyLoadedEgo/ClefMCP
#   workflow:   publish.yml
# Requires npm >= 11.5 (shipped with Node 24) for OIDC-based publishing.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + trusted publishing (OIDC)
      contents: write # attach the .mcpb bundle to the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Publish to npm (skips when the version is already on the registry)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "clef-mcp@$V" version >/dev/null 2>&1; then
            echo "clef-mcp@$V already published, skipping npm publish"
          else
            npm publish --provenance --access public
          fi
      - name: Publish to the official MCP Registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tgz
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher login github-oidc
          # npm CDN can lag a few seconds behind a fresh publish; the registry
          # validates the npm package, so retry until it is visible.
          for attempt in 1 2 3 4 5; do
            if mcp-publisher publish; then
              exit 0
            fi
            echo "registry publish attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "registry publish failed after 5 attempts" >&2
          exit 1
      - name: Build .mcpb bundle
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          STAGE=$(mktemp -d)
          cp -R dist manifest.json package.json package-lock.json NOTICE LICENSE "$STAGE/"
          cd "$STAGE"
          npm ci --omit=dev --no-audit --no-fund
          npx -y @anthropic-ai/mcpb pack "$STAGE" "$GITHUB_WORKSPACE/clef-mcp-${VERSION}.mcpb"
      - name: Attach bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" "clef-mcp-${VERSION}.mcpb" --clobber || \
            gh release create "v${VERSION}" "clef-mcp-${VERSION}.mcpb" --title "clef-mcp v${VERSION}" --generate-notes
