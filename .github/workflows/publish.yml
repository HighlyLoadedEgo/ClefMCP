name: Publish to npm

# Publishes on version tags (v0.1.0, ...) via npm Trusted Publishing (OIDC):
# no NPM_TOKEN secret required. Configure the trusted publisher on npmjs.com
# once (package → Settings → Trusted Publisher):
#   repository: HighlyLoadedEgo/ClefMCP
#   workflow:   publish.yml
# Requires npm >= 11.5 (shipped with Node 24) for OIDC-based publishing.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance + trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Publish to npm (skips when the version is already on the registry)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "clef-mcp@$V" version >/dev/null 2>&1; then
            echo "clef-mcp@$V already published, skipping npm publish"
          else
            npm publish --provenance --access public
          fi
      - name: Publish to the official MCP Registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tgz
          tar -xzf /tmp/mcp-publisher.tgz -C /tmp mcp-publisher
          sudo mv /tmp/mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher publish
